name: Rust Tests

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: rust-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Configure Git test defaults
        run: |
          git config --global init.defaultBranch main
          git config --global user.name "Refine Tests"
          git config --global user.email "refine-tests@example.invalid"

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run in-crate tests
        run: cargo test --lib
