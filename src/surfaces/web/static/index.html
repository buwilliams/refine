<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>refine</title>
  <link rel="icon" href="/static/images/favicon.svg" type="image/svg+xml">
  <script src="/static/js/theme.js"></script>
  <link rel="stylesheet" href="/static/css/base.css">
  <link rel="stylesheet" href="/static/css/dashboard.css">
  <link rel="stylesheet" href="/static/css/common.css">
  <link rel="stylesheet" href="/static/css/modals.css">
  <link rel="stylesheet" href="/static/css/goals.css">
  <link rel="stylesheet" href="/static/css/templates.css">
  <link rel="stylesheet" href="/static/css/workflow-settings.css">

</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/" data-route="dashboard" data-node-scope-destination="dashboard" aria-label="Refine dashboard">
      <img class="brand-logo brand-logo-light" src="/static/images/refine_logo_transparent.png" alt="refine">
      <img class="brand-logo brand-logo-dark" src="/static/images/refine_logo_transparent_darkmode.png" alt="refine">
    </a>
    <nav class="nav" data-testid="primary-nav">
      <a href="#/" data-route="dashboard" data-node-scope-destination="dashboard" data-testid="nav-dashboard">Dashboard</a>
      <a href="#/features" data-route="features" data-testid="nav-features">Features</a>
      <a href="#/goals" data-route="goals" data-node-scope-destination="goals" data-testid="nav-goals">Goals</a>
      <a href="#/changes" data-route="changes" data-testid="nav-changes">Changes</a>
      <a href="#/settings/processes" data-route="settings" data-testid="nav-settings">Settings</a>
    </nav>
    <div class="topbar-actions">
      <details class="nav-menu nav-context-picker" data-topbar-picker="node">
        <summary class="nav-context-summary nav-picker-summary" aria-label="Choose Node" aria-haspopup="listbox">
          <span class="nav-picker-copy"><span class="nav-picker-label">Node</span><span data-picker-value>Loading…</span></span>
          <span class="nav-context-more" aria-hidden="true"></span>
        </summary>
        <select id="global-node" aria-label="Node" data-testid="global-node" hidden tabindex="-1" disabled></select>
        <div class="nav-menu-panel nav-picker-options" role="listbox" aria-label="Choose Node"></div>
      </details>
      <details class="nav-menu nav-context-picker" data-topbar-picker="reporter">
        <summary class="nav-context-summary nav-picker-summary" aria-label="Choose Reporter" aria-haspopup="listbox">
          <span class="nav-picker-copy"><span class="nav-picker-label">Reporter</span><span data-picker-value>Loading…</span></span>
          <span class="nav-context-more" aria-hidden="true"></span>
        </summary>
        <select id="global-reporter" aria-label="Reporter" data-testid="global-reporter" hidden tabindex="-1"></select>
        <div class="nav-menu-panel nav-picker-options" role="listbox" aria-label="Choose Reporter"></div>
      </details>
      <div class="nav-create-group">
        <a class="btn nav-action nav-create-primary" href="#/goals/new" id="btn-new-goal" data-testid="nav-new-goal">+ New Goal</a>
        <details class="nav-menu nav-create-menu" id="nav-create-menu">
          <summary class="btn nav-action nav-create-more" aria-label="Open New Goal menu" data-testid="create-menu-toggle"></summary>
          <div class="nav-menu-panel nav-create-panel nav-context-panel">
            <div class="nav-menu-label">Create</div>
            <a class="nav-menu-item" href="#/features/new" id="btn-new-feature" data-testid="nav-new-feature">New Feature</a>
            <a class="nav-menu-item" href="#/goals/import" id="btn-import" data-testid="nav-import-goals">Import</a>
          <div class="nav-menu-label">Status</div>
          <div class="quick-status-row">
            <a id="workflow-status-indicator" class="workflow-status-indicator nav-menu-item nav-control-item"
               href="#/settings/processes" aria-label="Workflow status: unknown; click to view processes"
               title="Workflow status: unknown" data-state="unknown">
              <span class="target-app-dot" aria-hidden="true"></span>
              <span>Workflow status</span>
            </a>
            <div class="quick-status-actions" id="quick-workflow-actions" aria-label="Workflow actions"></div>
          </div>
          <div class="quick-status-row">
            <a id="target-app-indicator" class="target-app-indicator nav-menu-item nav-control-item"
               href="#/settings/processes"
               aria-label="Target application status (click to manage)"
               title="Target application status"
               data-testid="context-target-app-status"
               data-state="unknown">
              <span class="target-app-dot" aria-hidden="true"></span>
              <span>Target application status</span>
            </a>
            <div class="quick-status-actions" id="quick-target-actions" aria-label="Target application actions"></div>
          </div>
          <section id="nav-knowledge-hub" aria-label="Knowledge Hub"></section>
          <section id="nav-manual-skills" aria-label="Skills"></section>
          <div class="nav-menu-label nav-context-section-label">Tools and Support</div>
          <button class="nav-menu-item nav-control-item nav-management-item nav-command-button" id="btn-command-palette"
                  data-testid="command-palette-button"
                  aria-label="Open command palette">
            <svg class="nav-menu-icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="m20 20-4-4"></path>
            </svg>
            <span>Command palette</span>
          </button>
          <button class="nav-menu-item nav-control-item nav-management-item nav-issue-button" id="btn-refine-issue"
                  data-testid="nav-refine-issue"
                  aria-label="Contact Refine Devs"
                  title="Contact Refine Devs">
            <svg class="nav-menu-icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path d="M9 7V6a3 3 0 0 1 6 0v1M8 3l2 2m6-2-2 2"></path>
              <rect x="7" y="7" width="10" height="14" rx="5"></rect>
              <path d="M12 7v14M3 9l4 2m-4 4h4m-4 6 4-3M21 9l-4 2m4 4h-4m4 6-4-3"></path>
            </svg>
            <span>Contact Refine Devs</span>
          </button>
          <button class="nav-menu-item nav-control-item nav-management-item nav-theme-toggle" id="btn-theme-toggle"
                  data-testid="nav-theme-toggle"
                  type="button"
                  aria-label="Use dark mode"
                  aria-pressed="false">
            <svg class="nav-menu-icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.5 8.5 0 1 0 20.5 14.2Z"></path>
            </svg>
            <span class="nav-control-copy">
              <span>Dark mode</span>
              <span class="nav-control-status nav-theme-status">Off</span>
            </span>
          </button>
          <a class="nav-menu-item nav-management-item" href="#/guide" id="nav-guide-open" data-route="guide" data-testid="nav-guide-open">
            <svg class="nav-menu-icon" aria-hidden="true" viewBox="0 0 24 24" focusable="false">
              <path d="M12 7v14"></path>
              <path d="M3 5a2 2 0 0 1 2-2h4a3 3 0 0 1 3 3v15a3 3 0 0 0-3-3H5a2 2 0 0 1-2-2V5Z"></path>
              <path d="M21 5a2 2 0 0 0-2-2h-4a3 3 0 0 0-3 3v15a3 3 0 0 1 3-3h4a2 2 0 0 0 2-2V5Z"></path>
            </svg>
            <span>Guide</span>
          </a>
          </div>
        </details>
      </div>
    </div>
  </header>

  <div id="banners" class="banners"></div>

  <main id="main"></main>

  <aside id="toolbar-dock" class="toolbar-dock" aria-label="Toolbar" data-testid="toolbar-dock"></aside>
  <aside id="guide-panel" class="guide-panel" aria-label="Guide" aria-hidden="true" data-testid="guide-panel"></aside>

  <template id="t-banner">
    <div class="banner" data-testid="global-banner">
      <span class="banner-msg" data-testid="global-banner-message"></span>
      <span class="banner-actions" data-testid="global-banner-actions"></span>
    </div>
  </template>

  <script src="/static/js/features/changes.js"></script>
  <script src="/static/js/features/terminal-clipboard.js"></script>
  <script src="/static/js/features/terminal-keyboard.js"></script>
  <script src="/static/js/features/toolbar.js"></script>
  <script src="/static/js/features/toolbar-todo.js"></script>
  <script src="/static/js/features/guide.js"></script>
  <script src="/static/js/features/settings_target_app_tests.js"></script>
  <script src="/static/js/features/settings_application.js"></script>
  <script src="/static/js/features/settings_processes.js"></script>
  <script src="/static/js/features/settings_skills.js"></script>
  <script src="/static/js/features/settings_templates_map.js"></script>
  <script src="/static/js/features/settings_templates.js"></script>
  <script src="/static/js/features/settings_workflow.js"></script>
  <script src="/static/js/features/knowledge-hub.js"></script>
  <script src="/static/js/features/workflow-controls.js"></script>
  <script src="/static/js/features/settings_runtime.js"></script>
  <script src="/static/js/features/source_update.js"></script>
  <script src="/static/js/features/settings_nodes.js"></script>
  <script src="/static/js/features/settings_reporters.js"></script>
  <script src="/static/js/features/settings.js"></script>
  <script src="/static/js/quick-actions.js"></script>

  <script src="/static/js/router.js"></script>
  <script src="/static/js/init.js"></script>
</body>
